name: Diagnóstico Emendas Parlamentares v2

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Anos separados por vírgula"
        required: true
        default: "2023,2024,2025,2026"
        type: string
      amendment_sample:
        description: "Quantidade de emendas para localizar documentos"
        required: true
        default: "160"
        type: string
      detail_sample:
        description: "Quantidade de documentos para abrir em detalhe"
        required: true
        default: "300"
        type: string
      final_beneficiary_sample:
        description: "Documentos de pagamento/liquidação para consultar favorecidos finais"
        required: true
        default: "240"
        type: string

permissions:
  contents: read

concurrency:
  group: diagnostico-emendas-parlamentares-v2
  cancel-in-progress: false

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      PORTAL_TRANSPARENCIA_API_KEY: ${{ secrets.PORTAL_TRANSPARENCIA_API_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar configuração
        shell: bash
        run: |
          test -n "$PORTAL_TRANSPARENCIA_API_KEY" || {
            echo "::error::Crie o segredo PORTAL_TRANSPARENCIA_API_KEY."
            exit 1
          }

          echo "Chave da API disponível."

          if [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Os autores serão comparados com os casos atuais."
          else
            echo "::warning::Supabase ausente; a coleta seguirá sem comparar autores."
          fi

      - name: Executar diagnóstico nacional v2
        run: |
          node scripts/emendas/coletar-diagnostico.mjs \
            --years="${{ inputs.years }}" \
            --amendment-sample="${{ inputs.amendment_sample }}" \
            --detail-sample="${{ inputs.detail_sample }}" \
            --final-beneficiary-sample="${{ inputs.final_beneficiary_sample }}" \
            --delay-ms=180 \
            --output=data/emendas/diagnostico-v2

      - name: Publicar diagnóstico para download
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-emendas-v2-${{ github.run_id }}
          path: data/emendas/diagnostico-v2/
          if-no-files-found: error
          retention-days: 30

      - name: Resumo da execução
        if: always()
        run: |
          echo "Esta execução não altera o Supabase nem o site."
          echo "A execução abre documentos de despesa e consulta favorecidos finais."
